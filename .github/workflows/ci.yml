name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          # Pinned: grid_t30_baseline_test.go and grid_c38_e2e_test.go compare
          # bit-exact float64 digests that were anchored on go1.27.1. A different
          # patch release can change the last bits of math.Tan/math.Pow, so the
          # toolchain has to match the anchors (go.mod also pins
          # `toolchain go1.27.1`).
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          echo "go version: $(go version)" > test-output.txt
          # Actions runs bash -e, which would abort on the failing go test before
          # the output could be turned into annotations.
          set +e
          go test -count=1 ./... 2>&1 | tee -a test-output.txt
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            # Re-emit the interesting output as check annotations: they are
            # readable through the public API, job logs are not.
            grep -vE '^(ok|\?) ' test-output.txt | head -60 | while IFS= read -r line; do
              echo "::error file=.github/workflows/ci.yml,line=1::${line}"
            done
            echo "::error file=.github/workflows/ci.yml,line=1::go test exited with ${rc}"
          fi
          exit "$rc"

  wasm:
    name: wasm target
    runs-on: ubuntu-latest
    env:
      GOOS: js
      GOARCH: wasm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.mod
      - name: Build wasm
        run: go build ./wasm/...

  generated:
    name: generated files in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi
      - name: specgen -check
        run: go run ./cmd/specgen -dir specdata -paramdata paramdata -out spec -check
      - name: paramgen -check
        run: go run ./cmd/paramgen -dir paramdata -out paramdb -check
